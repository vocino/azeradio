name: tray-release

on:
  push:
    tags: ["tray/v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The tray app runs on the PC that runs WoW. Windows first;
    # add macos-latest here (plus an icon.icns) when a Mac build is wanted.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Version stamping lives in tray/stamp-version.js (a file, not `node -e`):
      # the old inline version broke because PowerShell mangles nested quotes.
      - name: Stamp version from tag
        shell: bash
        run: node tray/stamp-version.js "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tray

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tray
          tagName: ${{ github.ref_name }}
          releaseName: "Azeradio tray ${{ github.ref_name }}"
          releaseDraft: false
