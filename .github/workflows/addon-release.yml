name: addon-release

on:
  push:
    tags: ["addon/v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#addon/v}"
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" \
            addon/Azeradio/Azeradio.toc addon/Azeradio/Azeradio_Forever.toc
          grep -h "## Version" addon/Azeradio/*.toc

      - name: Zip addon
        run: |
          VERSION="${GITHUB_REF_NAME#addon/v}"
          cd addon && zip -r "../Azeradio-${VERSION}.zip" Azeradio
          cp "../Azeradio-${VERSION}.zip" ../Azeradio.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Azeradio-*.zip
          generate_release_notes: true

      - name: Update latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addon/latest
          name: "Azeradio addon (latest)"
          body: "Latest addon build. Older versions live under Releases."
          files: Azeradio.zip
