[package]
name = "azeradio"
version = "0.1.0"
edition = "2021"
description = "Azeradio tray bridge: WoW zone changes switch Spotify playlists"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tiny_http = "0.12"
open = "5"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
rfd = "0.15"
